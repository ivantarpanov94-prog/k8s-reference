<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Reference Hub</title>
    <style>
        :root {
            --primary: #1a73e8;
            --control-plane-bg: #fdf2e9;
            --control-plane-border: #d35400;
            --worker-bg: #ebf5fb;
            --worker-border: #2980b9;
            --etcd-border: #f1c40f;
            --etcd-bg: #fef9e7;
            --apiserver-border: #3498db;
            --apiserver-bg: #ebf5fb;
            --controller-border: #9b59b6;
            --controller-bg: #f5eef8;
            --scheduler-border: #e67e22;
            --scheduler-bg: #fbeee6;
            --kubelet-border: #27ae60;
            --kubelet-bg: #eaf2f8;
            --kubeproxy-border: #8e44ad;
            --kubeproxy-bg: #f4ecf7;
            --pod-border: #16a085;
            --pod-bg: #e8f8f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f4f6f9;
            color: #333;
            padding: 0 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e1e8ed;
        }
        /* Top Navigation Bar */
        .nav-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .nav-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: #cbd5e1;
        }
        .nav-btn.active {
            background: var(--primary);
            color: white;
        }
        /* Shared Styles for Modules */
        h2, h3, h4 { margin-top: 0; }
        .section-title { color: var(--primary); border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-top: 30px; }
        .deep-dive-card { border-radius: 8px; padding: 18px; margin-bottom: 18px; }
        pre { background: #282c34; color: #abb2bf; padding: 12px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 13px; overflow-x: auto; }
        .cmd-comment { color: #7f8c8d; font-style: italic; }
        .cmd-text { color: #61afef; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: var(--primary); margin-top: 0;">🚀 DevOps Reference & Training Hub</h2>
        <p style="color: #64748b; font-size: 14.5px; margin-bottom: 20px;">
            Switch between different learning paths below. Your notes stay modular, clean, and infinitely scalable!
        </p>
        
        <!-- Navigation Tabs -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="loadModule('kubernetes')">☸️ Kubernetes</button>
            <button class="nav-btn" onclick="loadModule('git')">🌿 Git Version Control</button>
            <!-- Future modules (e.g., Docker, Terraform) can be added here easily -->
        </div>

        <!-- Dynamic Content Injection Zone -->
        <div id="content-viewport">
            <!-- Module content loads here automatically -->
        </div>
    </div>

    <script>
        async function loadModule(moduleName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            try {
                let response = await fetch(`modules/${moduleName}.html`);
                if (!response.ok) throw new Error(`Could not load modules/${moduleName}.html`);
                let htmlContent = await response.text();
                document.getElementById('content-viewport').innerHTML = htmlContent;
            } catch (error) {
                document.getElementById('content-viewport').innerHTML = `<p style="color: red;">Error loading module: ${error.message}. Make sure you are running via a local server (like VS Code Live Server).</p>`;
            }
        }

        // Load Kubernetes by default on startup
        window.onload = () => {
            loadModule('kubernetes');
        };
    </script>
</body>
</html>
