<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Reference Hub</title>
    <style>
        :root {
            --primary: #1a73e8;
            --control-plane-bg: #fdf2e9;
            --control-plane-border: #d35400;
            --worker-bg: #ebf5fb;
            --worker-border: #2980b9;
            --etcd-border: #f1c40f;
            --etcd-bg: #fef9e7;
            --apiserver-border: #3498db;
            --apiserver-bg: #ebf5fb;
            --controller-border: #9b59b6;
            --controller-bg: #f5eef8;
            --scheduler-border: #e67e22;
            --scheduler-bg: #fbeee6;
            --kubelet-border: #27ae60;
            --kubelet-bg: #eaf2f8;
            --kubeproxy-border: #8e44ad;
            --kubeproxy-bg: #f4ecf7;
            --pod-border: #16a085;
            --pod-bg: #e8f8f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f4f6f9;
            color: #333;
            padding: 0 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e1e8ed;
        }
        .nav-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .nav-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #cbd5e1; }
        .nav-btn.active { background: var(--primary); color: white; }

        h2, h3, h4 { margin-top: 0; }
        .section-title { color: var(--primary); border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-top: 30px; }
        
        .diagram-container {
            width: 100%;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 25px;
            text-align: center;
        }
        .diagram-svg { width: 100%; height: auto; max-width: 780px; }
        .interactive-node { cursor: pointer; transition: all 0.25s ease; }
        .interactive-node:hover rect { filter: drop-shadow(0px 0px 6px rgba(26, 115, 232, 0.6)); stroke-width: 2.5px; }
        .interactive-node:hover text { font-weight: bold; }

        .card-highlight { animation: highlightGlow 2s ease-out; }
        @keyframes highlightGlow {
            0% { box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.6); transform: scale(1.01); }
            100% { box-shadow: 0 0 0 0px rgba(26, 115, 232, 0); transform: scale(1); }
        }

        .deep-dive-card { border-radius: 8px; padding: 18px; margin-bottom: 18px; }
        .card-etcd { background-color: var(--etcd-bg); border: 1.5px solid var(--etcd-border); }
        .card-apiserver { background-color: var(--apiserver-bg); border: 1.5px solid var(--apiserver-border); }
        .card-controller { background-color: var(--controller-bg); border: 1.5px solid var(--controller-border); }
        .card-scheduler { background-color: var(--scheduler-bg); border: 1.5px solid var(--scheduler-border); }
        .card-kubelet { background-color: var(--kubelet-bg); border: 1.5px solid var(--kubelet-border); }
        .card-kubeproxy { background-color: var(--kubeproxy-bg); border: 1.5px solid var(--kubeproxy-border); }
        .card-pod { background-color: var(--pod-bg); border: 1.5px solid var(--pod-border); }

        .card-header-etcd { color: #b7950b; border-bottom: 1px solid #f7dc6f; }
        .card-header-apiserver { color: #1f618d; border-bottom: 1px solid #aed6f1; }
        .card-header-controller { color: #723280; border-bottom: 1px solid #d7bde2; }
        .card-header-scheduler { color: #a04000; border-bottom: 1px solid #f5cba7; }
        .card-header-kubelet { color: #1e8449; border-bottom: 1px solid #a9dfbf; }
        .card-header-kubeproxy { color: #6c3483; border-bottom: 1px solid #d2b4de; }
        .card-header-pod { color: #117864; border-bottom: 1px solid #a3e4d7; }

        ul.card-list { padding-left: 18px; font-size: 14px; margin-top: 8px; margin-bottom: 0; line-height: 1.7; }
        .hint-banner { background-color: #e8f4f8; border-left: 4px solid var(--primary); padding: 10px 14px; border-radius: 4px; font-size: 13.5px; margin-bottom: 20px; color: #1a5276; }

        /* Code Block & Quick-Copy Styling */
        .code-wrapper {
            position: relative;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        pre { background: #282c34; color: #abb2bf; padding: 12px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 13px; overflow-x: auto; margin: 0; }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #abb2bf;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: var(--primary); margin-top: 0;">🚀 DevOps Reference & Training Hub</h2>
        <p style="color: #64748b; font-size: 14.5px; margin-bottom: 20px;">
            Switch between different learning paths below. Your notes stay modular, clean, and infinitely scalable!
        </p>
        
        <div class="nav-bar">
            <button class="nav-btn active" id="btn-kubernetes" onclick="loadModule('kubernetes', this)">☸️ Kubernetes</button>
            <button class="nav-btn" id="btn-git" onclick="loadModule('git', this)">🌿 Git Version Control</button>
        </div>

        <div id="content-viewport"></div>
    </div>

    <script>
        async function loadModule(moduleName, clickedBtn) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (clickedBtn) {
                clickedBtn.classList.add('active');
            } else {
                const defaultBtn = document.getElementById(`btn-${moduleName}`);
                if (defaultBtn) defaultBtn.classList.add('active');
            }

            try {
                let response = await fetch(`modules/${moduleName}.html`);
                if (!response.ok) throw new Error(`Could not load modules/${moduleName}.html`);
                let htmlContent = await response.text();
                document.getElementById('content-viewport').innerHTML = htmlContent;

                // Post-process: Wrap <pre> blocks with quick-copy buttons automatically
                enhanceCodeBlocks();
            } catch (error) {
                document.getElementById('content-viewport').innerHTML = `<p style="color: red;">Error loading module: ${error.message}. Make sure you are running via a local server (like VS Code Live Server).</p>`;
            }
        }

        function enhanceCodeBlocks() {
            const viewport = document.getElementById('content-viewport');
            const preTags = viewport.querySelectorAll('pre');
            
            preTags.forEach(pre => {
                if (pre.parentNode.classList && pre.parentNode.classList.contains('code-wrapper')) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const button = document.createElement('button');
                button.className = 'copy-btn';
                button.innerText = 'Copy';
                button.onclick = () => {
                    navigator.clipboard.writeText(pre.innerText).then(() => {
                        button.innerText = 'Copied!';
                        setTimeout(() => { button.innerText = 'Copy'; }, 2000);
                    });
                };
                wrapper.appendChild(button);
            });
        }

        function scrollToSection(sectionId) {
            const element = document.getElementById(sectionId);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                element.classList.remove('card-highlight');
                void element.offsetWidth;
                element.classList.add('card-highlight');
            } else {
                console.warn(`Target section with ID "${sectionId}" was not found on the page.`);
            }
        }

        window.onload = () => { loadModule('kubernetes'); };
    </script>
</body>
</html>
